[project]
name = "pristine"
version = "0.10.0"
description = "Predictable code structure and defect checks for AI coding agents."
readme = "README.md"
authors = [{name = "Matthias Laithier", email = "matthias.laithier@gmail.com"}]
license = "MIT"
requires-python = ">=3.15"
keywords = ["ai-agents", "coding-standards", "code-quality", "static-analysis", "linter", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.23,<2",
]

[project.urls]
Homepage = "https://github.com/Matthias-Laithier/pristine"
Repository = "https://github.com/Matthias-Laithier/pristine"
Issues = "https://github.com/Matthias-Laithier/pristine/issues"

[project.scripts]
pristine = "pristine.cli.main:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.85",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E402", "I", "B", "UP", "SIM", "PL", "ERA", "FBT", "BLE", "ARG", "S", "ASYNC", "DTZ", "G", "T20", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
ignore = ["PLR0913", "PLR0917"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"tests/conftest.py" = ["S603"]
"src/pristine/cli/main.py" = ["T20"]
"src/pristine/services/git.py" = ["S603"]
"src/pristine/services/native_tools/processes.py" = ["S603"]
"src/pristine/services/isolated_inspection.py" = ["S603"]
"src/pristine/services/worker_pool.py" = ["S603"]

[tool.ty.rules]
all = "error"
