[project]
name = "pristine"
version = "0.1.0"
description = "Opinionated coding rules for AI coding agents, with a CLI that serves them and checks their mechanical part."
readme = "README.md"
authors = [{name = "Matthias Laithier", email = "matthias.laithier@gmail.com"}]
license = "MIT"
requires-python = ">=3.13"
keywords = ["ai-agents", "coding-standards", "code-quality", "static-analysis", "linter", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-language-pack>=1.23,<2",
]

[project.urls]
Homepage = "https://github.com/Matthias-Laithier/pristine"
Repository = "https://github.com/Matthias-Laithier/pristine"
Issues = "https://github.com/Matthias-Laithier/pristine/issues"

[project.scripts]
pristine = "pristine.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.85",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM", "PL", "ERA", "S", "ASYNC", "DTZ", "G", "T20"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
"tests/conftest.py" = ["S603"]
"src/pristine/cli.py" = ["T20"]
"src/pristine/services/git.py" = ["S603"]
"src/pristine/services/gitleaks.py" = ["S603"]
"src/pristine/services/isolated_inspection.py" = ["S603"]
