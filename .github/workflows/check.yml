name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - run: uv sync --locked

      - name: Locate the grammar cache
        id: grammars
        run: echo "dir=$(uv run python -c 'import tree_sitter_language_pack as t; print(t.cache_dir())')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.grammars.outputs.dir }}
          key: grammars-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - run: make check-all
